plugins {
    id 'com.android.application'
}

android {
    namespace 'com.widge.couchlight.indo'
    compileSdk 34

    defaultConfig {
        applicationId "com.widge.couchlight.indo"
        minSdk 19
        targetSdk 34
        versionCode 2
        versionName "2.0-LiveBackdrop-FIX"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
